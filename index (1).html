<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F6F3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lift Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single-column phone app. Sticky top bar, scrolling content, fixed bottom tabs. Gym tach: green/yellow/red effort zones. */
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --sunk:#EEEEE9; --ink:#16191D; --muted:#5C6168; --line:#DEDED8; --tint:#E9EDF2;
  --accent:#1F3A5F; --accent-ink:#FFFFFF;
  --w1:#2F6B4F; --w2:#8A6A12; --w3:#9E3A2F; --w4:#3E5F8A;
  --good:#2F6B4F; --warn:#9A5B12; --bad:#9E3A2F; --pr:#8A4F0E; --prbg:#F5ECDD;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1A1D21; --sunk:#23272C; --ink:#E6E8EA; --muted:#9AA0A8; --line:#2C3137; --tint:#1E2733;
  --accent:#8FB0D8; --accent-ink:#0E1520;
  --w1:#6FBF95; --w2:#D4AE55; --w3:#E0806F; --w4:#8FB0D8;
  --good:#6FBF95; --warn:#D4AE55; --bad:#E0806F; --pr:#E0A85C; --prbg:#33291A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1A1D21; --sunk:#23272C; --ink:#E6E8EA; --muted:#9AA0A8; --line:#2C3137; --tint:#1E2733;
  --accent:#8FB0D8; --accent-ink:#0E1520;
  --w1:#6FBF95; --w2:#D4AE55; --w3:#E0806F; --w4:#8FB0D8;
  --good:#6FBF95; --warn:#D4AE55; --bad:#E0806F; --pr:#E0A85C; --prbg:#33291A; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;flex:1;min-width:0}
.brand b{color:inherit;font-weight:600}

h2{font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:10px 14px;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.big{font-size:21px;font-weight:500;padding:16px 20px;width:100%;min-height:64px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:2px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.tag.pr{color:var(--pr)}
.tag.good{color:var(--good)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.acc{color:var(--accent)} .tag.mut{color:var(--muted)}

/* Week strip + gauge */
.weekcard{gap:4px}
.wk-big{font-weight:500;font-size:32px;line-height:1.15;letter-spacing:-.01em}
.wk-sub{font-size:15px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.striplab{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.striplab .on{color:var(--ink)}
.strip span{height:4px;border-radius:0;background:var(--sunk);position:relative;overflow:hidden}
.strip span i{position:absolute;inset:0 auto 0 0;display:block}
.gauge{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
.gauge text{font-family:var(--display);font-size:13px;fill:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--mono);font-weight:400;font-size:24px;line-height:1}
.stat .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.nudge{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.nudge::before{content:"";width:8px;height:8px;margin-top:7px;flex:none;background:var(--warn)}
.nudge.bad::before{background:var(--bad)} .nudge.acc::before{background:var(--accent)}
.nudge .grow p+p{margin-top:2px}

.example{border:1px dashed var(--warn);color:var(--ink);background:transparent;padding:10px 12px;border-radius:2px;font-size:14px}

/* Session */
.sess-head{display:flex;flex-direction:column;gap:8px}
.part{display:flex;flex-direction:column;gap:8px}
.part-h{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 0;width:100%;text-align:left}
.part-h .pn{font-size:20px;font-weight:500;flex:1}
.count{font-family:var(--mono);font-size:14px;font-weight:400;padding:4px 10px;border-radius:0;border:1px solid var(--line);color:var(--muted)}
.count.in{border-color:var(--good);color:var(--good)}
.count.over{border-color:var(--accent);color:var(--accent)}
.chev{transition:transform .15s;color:var(--muted)}
.closed .chev{transform:rotate(-90deg)}

.ex-name{font-weight:600;font-size:17px;background:none;border:0;padding:0;text-align:left}
.lastline{font-size:14px;color:var(--muted)}
.lastline b{color:var(--ink);font-weight:600}
.note{font-size:14px;background:var(--sunk);border-radius:2px;padding:6px 10px}
.sets{display:flex;flex-direction:column;gap:4px}
.setrow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:10px 6px;border-radius:0;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.setrow .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.setrow .v{font-family:var(--mono);font-size:17px;font-weight:400}
.setrow.pr{background:var(--prbg)}
.setrow .msg{grid-column:2 / 4;font-size:13px}
.setrow.sloppy .v{text-decoration:line-through;text-decoration-color:var(--muted)}

.entry{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step{display:grid;grid-template-columns:40px 1fr 40px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--surface)}
.step button{border:0;background:var(--sunk);font-size:22px;font-weight:600;min-height:48px}
.step input{border:0;background:transparent;text-align:center;font-family:var(--mono);font-size:24px;font-weight:400;width:100%;min-width:0;padding:0}
.step input:focus{outline:none}
.target{grid-column:1 / 3;font-size:14px;padding:12px 14px;border-radius:0;background:var(--tint)}
.target b{font-family:var(--mono);font-size:22px;font-weight:400}
.rir{grid-column:1 / 3;display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:center}
.rir span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:2px}
.rir button{min-height:44px;border-radius:2px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:17px;font-weight:400}
.rir button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.logbtn{grid-column:1 / 3}

.counter{display:flex;align-items:center;gap:12px}
.counter .big{font-family:var(--mono);font-size:40px;font-weight:400;line-height:1;min-width:70px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;padding:12px 4px;font-size:14px;font-weight:500;color:var(--muted);min-height:54px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,15,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:4px 4px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h3{flex:1;font-size:20px;font-weight:500}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:12px;border-radius:2px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.li[disabled]{opacity:.5}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}

input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1 / 3}
.chk{display:flex;align-items:center;gap:8px;font-size:15px}
.chk input{width:20px;height:20px}
.edrow{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.edrow:last-child{border-bottom:0}
.wkrow{display:grid;grid-template-columns:28px 1fr 64px 64px;gap:6px;align-items:center}
.ptrow{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;align-items:center}
.swatch{width:20px;height:20px;border-radius:4px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:2px;z-index:25;font-weight:600;max-width:90%}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

</head>
<body>
<header class="top"><div class="top-in"><div class="brand">Lift Log</div><span id="topWeek"></span></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="Main"><div class="tabs-in">
  <button data-act="tab" data-v="today" id="t-today">Today</button>
  <button data-act="tab" data-v="history" id="t-history">History</button>
  <button data-act="tab" data-v="settings" id="t-settings">Settings</button>
</div></nav>
<canvas id="fx" hidden></canvas>

<script>
(function(){
"use strict";
/* ---------- Constants ---------- */
const KEY="redline.v1";
const DAYS={push:"Push",pull:"Pull",legs:"Legs"};
const DAYPARTS={push:["chest","shoulders","triceps"],pull:["back","traps","biceps","lowback","abs"],legs:["legs"]};
const WCOL=["var(--w1)","var(--w2)","var(--w3)","var(--w4)"];
const REASONS=["Other activity","Life is busy","Recovering","Sick","Travel"];

function defaultParts(){return {
  chest:{name:"Chest",day:"push",min:6,max:6},
  shoulders:{name:"Shoulders",day:"push",min:6,max:8},
  triceps:{name:"Triceps",day:"push",min:6,max:6},
  back:{name:"Back",day:"pull",min:8,max:8},
  traps:{name:"Traps",day:"pull",min:2,max:2},
  biceps:{name:"Biceps",day:"pull",min:6,max:6},
  lowback:{name:"Low Back",day:"pull",min:2,max:2},
  abs:{name:"Abs",day:"pull",min:5,max:5},
  legs:{name:"Legs",day:"legs",min:6,max:6}
};}
function defaultExercises(){
  const L=[];
  const add=(part,name,o)=>L.push(Object.assign({id:"e"+(L.length+1),name,part,kind:"weight",perHand:/Dumbbell|Lunge/.test(name),formFocus:false,group:null,also:[],note:"",hidden:false},o||{}));
  ["Flat Dumbbell Press","Flat Dumbbell Fly","Incline Dumbbell Press","Incline Dumbbell Fly","Cable Crossover","Two Hand Cable Press","Seated Pec Deck Fly"].forEach(n=>add("chest",n));
  add("shoulders","Seated Dumbbell Press",{group:"spress"});
  add("shoulders","Dumbbell Lateral Raise",{group:"lat"});
  add("shoulders","Dumbbell Front Raise");
  add("shoulders","One Arm Cable Lateral Raise",{group:"lat"});
  add("shoulders","Bent Over Dumbbell Face Pull",{group:"fp"});
  add("shoulders","Cable Face Pull",{group:"fp",formFocus:true,also:["traps"]});
  add("shoulders","Seated Machine Press",{group:"spress"});
  add("triceps","Cable Pressdown");
  add("triceps","Rope Pressdown");
  add("triceps","One Arm Overhead Dumbbell Extension");
  add("triceps","Flat Dumbbell Extension",{group:"ext"});
  add("triceps","Incline Dumbbell Extension",{group:"ext"});
  add("triceps","Machine Dips",{group:"dip"});
  add("triceps","Bodyweight Dips",{group:"dip",kind:"bodyweight"});
  add("triceps","Single Arm Cable Extension");
  add("back","Pulldown");
  add("back","Cable Row");
  add("back","Underhand Pulldown");
  add("back","Underhand Cable Row");
  add("back","Dumbbell Row");
  add("back","Machine Assisted Pullup",{kind:"assist"});
  add("back","Dumbbell Pullover",{group:"po",note:"Lying on a bench."});
  add("back","Standing Cable Pullover",{group:"po"});
  add("traps","Dumbbell Shrug");
  add("traps","EZ Bar Upright Row",{group:"ur"});
  add("traps","Dumbbell Upright Row",{group:"ur"});
  add("traps","Cable Upright Row",{group:"ur"});
  add("biceps","Incline Dumbbell Curl");
  add("biceps","Standing Dumbbell Curl");
  add("biceps","Standing EZ Bar Curl",{group:"cb"});
  add("biceps","Cable Bar Curl",{group:"cb"});
  add("biceps","Single Arm Cable Curl");
  add("lowback","Back Extension",{kind:"bodyweight"});
  add("legs","Leg Extension");
  add("legs","Leg Curl");
  add("legs","Leg Press");
  add("legs","Walking Lunge");
  add("legs","Standing Lunge");
  add("legs","Sissy Squat",{kind:"bodyweight"});
  L.push({id:"abs",name:"Abs",part:"abs",kind:"counter",perHand:false,formFocus:true,group:null,also:[],note:"",hidden:false});
  return L;
}
function freshState(){return {
  v:1,cycleStart:today(),
  weeks:[{label:"Easy",min:3,max:4},{label:"Steady",min:1,max:2},{label:"All out",min:0,max:1},{label:"Light",min:4,max:5}],
  parts:defaultParts(),exercises:defaultExercises(),
  legsDays:10,minPerWeek:4,
  sessions:[],breaks:[],active:null,sample:null,nextId:1
};}

/* ---------- Dates ---------- */
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);}
function today(){return iso(new Date());}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);}
function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}
function ago(n){return n===0?"today":n===1?"yesterday":n+" days ago";}

/* ---------- Storage ---------- */
let S, storageOK=true;
function load(){
  try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):freshState();}catch(e){storageOK=false;S=freshState();}
  if(!S||!S.exercises){S=freshState();}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
function uid(){return "x"+(S.nextId++)+Date.now().toString(36);}

/* ---------- Lookups ---------- */
const exById=id=>S.exercises.find(e=>e.id===id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function activeSession(){return S.sessions.find(s=>s.id===S.active)||null;}
function unit(ex){return ex.kind==="assist"?"assist":ex.kind==="bodyweight"?"added":ex.perHand?"each":"lb";}
function wLabel(ex,w){
  if(ex.kind==="bodyweight") return w>0?"BW+"+w:"BW";
  if(ex.kind==="assist") return w+" assist";
  return String(w);
}

/* Cycle */
function pausedBetween(a,b){
  let n=0;S.breaks.forEach(br=>{if(!br.pause)return;const st=br.start,en=addDays(br.start,br.days);
    const lo=st>a?st:a, hi=en<b?en:b; const o=diff(lo,hi); if(o>0)n+=o;});
  return n;
}
function weekAt(date){
  let d=diff(S.cycleStart,date)-pausedBetween(S.cycleStart,date);
  if(d<0)d=0;
  return {idx:Math.floor(d/7)%4,cycle:Math.floor(d/28)+1,day:d%28+1};
}
function weekText(i){const w=S.weeks[i];return w.min+"–"+(i===3&&w.max>=5?w.max+"+":w.max)+" RIR";}

/* Sets */
function setsOf(exId,opts){
  opts=opts||{};const out=[];
  S.sessions.forEach(ss=>{ if(opts.exclude&&ss.id===opts.exclude)return;
    ss.sets.forEach(st=>{ if(st.ex!==exId)return; if(opts.clean&&(st.sloppy||ss.off))return; out.push(Object.assign({date:ss.date,wk:ss.wk,sid:ss.id},st));});});
  return out;
}
function capPoints(ex){
  const m=new Map();
  setsOf(ex.id,{clean:true}).forEach(s=>{ if(s.rir==null)return; const c=s.reps+s.rir; if(!m.has(s.w))m.set(s.w,[]); m.get(s.w).push(c);});
  const pts=[];m.forEach((arr,w)=>{const last=arr.slice(-3).sort((a,b)=>a-b);pts.push({w,c:last[Math.floor(last.length/2)],n:arr.length});});
  return pts.sort((a,b)=>a.w-b.w);
}
function estimate(ex,w){
  if(w==null||isNaN(w))return null;
  const pts=capPoints(ex); if(!pts.length)return null;
  const ex1=pts.find(p=>p.w===w); if(ex1)return {lo:ex1.c,hi:ex1.c,src:"history"};
  let lower=null,upper=null;
  pts.forEach(p=>{ if(p.w<w&&(!lower||p.w>lower.w))lower=p; if(p.w>w&&(!upper||p.w<upper.w))upper=p;});
  if(ex.kind==="assist"){
    if(lower&&upper){const t=(w-lower.w)/(upper.w-lower.w);const v=lower.c+(upper.c-lower.c)*t;return {lo:Math.max(1,Math.floor(v-1)),hi:Math.ceil(v+1),src:"estimate"};}
    return null;
  }
  if(w<=0)return null;
  if(lower&&lower.w>0&&upper){
    const t=(w-lower.w)/(upper.w-lower.w);const v=Math.exp(Math.log(lower.c)+(Math.log(upper.c)-Math.log(lower.c))*t);
    return {lo:Math.max(1,Math.round(v*0.92)),hi:Math.max(1,Math.round(v*1.08)),src:"estimate"};
  }
  const p=(lower&&lower.w>0)?lower:upper; if(!p||p.w<=0)return null;
  const e1=p.w*(1+p.c/30); const ce=30*(e1/w-1);
  const cb=p.c<36?37-36*w/(p.w*36/(37-p.c)):ce;
  const lo=Math.round(Math.min(ce,cb)),hi=Math.round(Math.max(ce,cb));
  if(hi<1)return {lo:0,hi:0,src:"estimate",heavy:true};
  return {lo:Math.max(1,lo),hi:Math.max(1,hi),src:"estimate"};
}
function target(ex,w,wk){
  const e=estimate(ex,w); if(!e)return null; if(e.heavy)return {heavy:true,src:e.src};
  const W=S.weeks[wk];
  const lo=Math.max(1,e.lo-W.max), hi=Math.max(lo,e.hi-W.min);
  return {lo,hi,src:e.src,cap:e};
}
function lightPick(ex){
  const pts=capPoints(ex).filter(p=>p.w>0); if(!pts.length||ex.kind!=="weight")return null;
  const maxW=pts[pts.length-1].w; const step=5; const cands=new Set(pts.map(p=>p.w));
  for(let w=Math.round(maxW*0.5/step)*step; w<=maxW; w+=step) cands.add(w);
  let best=null;
  [...cands].sort((a,b)=>b-a).forEach(w=>{ if(best)return; const e=estimate(ex,w); if(e&&!e.heavy&&(e.lo+e.hi)/2>=14) best={w,e};});
  if(!best){const w=Math.round(maxW*0.78/step)*step; return {w,fallback:true};}
  return {w:best.w,lo:Math.max(1,best.e.lo-5),hi:Math.max(1,best.e.hi-4)};
}
function lastLine(ex,wk,exclude){
  const all=setsOf(ex.id,{exclude}); if(!all.length)return null;
  const bySess=new Map(); all.forEach(s=>{ if(!bySess.has(s.sid))bySess.set(s.sid,[]); bySess.get(s.sid).push(s);});
  const sess=[...bySess.values()].sort((a,b)=>a[0].date<b[0].date?1:-1);
  let pick=sess.find(g=>g[0].wk===wk), same=!!pick; if(!pick)pick=sess[0];
  const top=pick.slice().sort((a,b)=>ex.kind==="assist"?((a.w-b.w)||(b.reps-a.reps)):((b.w-a.w)||(b.reps-a.reps)))[0];
    return {top,date:pick[0].date,wk:pick[0].wk,same,count:pick.length};
}
function checkPR(ex,w,reps,sessionOff,exclude){
  if(ex.formFocus||ex.kind==="counter"||sessionOff)return null;
  const prior=setsOf(ex.id,{clean:true}); if(!prior.length)return null;
  const atW=prior.filter(s=>s.w===w);
  if(atW.length){const best=Math.max(...atW.map(s=>s.reps));
    if(reps>best)return {tie:false,text:"Most reps at "+wLabel(ex,w)+": "+reps+" (was "+best+")"};
    if(reps===best)return {tie:true,text:"Ties your best at "+wLabel(ex,w)+": "+reps+" reps"};}
  const atR=prior.filter(s=>s.reps>=reps);
  if(atR.length){
    if(ex.kind==="assist"){const least=Math.min(...atR.map(s=>s.w)); if(w<least)return {tie:false,text:"Least assist for "+reps+"+ reps: "+w};}
    else {const most=Math.max(...atR.map(s=>s.w)); if(w>most)return {tie:false,text:"Heaviest for "+reps+"+ reps: "+wLabel(ex,w)+" (was "+wLabel(ex,most)+")"};}
  }

}
function nudgeFor(ex,st,wk,tg){
  if(ex.kind==="counter")return null;
  const W=S.weeks[wk],wn="Week "+(wk+1)+" is "+weekText(wk)+".";
  if(st.rir!=null&&st.rir<=W.min-2)return {lvl:"bad",text:"Redline. "+wn+" Ease off."};
  if(st.rir!=null&&!ex.formFocus&&st.rir>=W.max+2&&W.max<4)return {lvl:"warn",text:"Room to push. "+wn};
  if(tg&&!tg.heavy){
    if(st.reps<tg.lo*0.9)return {lvl:"warn",text:"Under target ("+tg.lo+"–"+tg.hi+"). Heavy day or off day?"};
    if(!ex.formFocus&&st.reps>tg.hi*1.1)return {lvl:"warn",text:"Over target ("+tg.lo+"–"+tg.hi+"). Today is "+weekText(wk)+". Still in range, or go heavier?"};
    return {lvl:"good",text:"On target."};
  }
  if(st.rir!=null&&st.rir>=W.min&&st.rir<=W.max)return {lvl:"good",text:"In this week's RIR range."};
  return null;
}

/* ---------- Fireworks ---------- */
function fireworks(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){toast("PR saved");return;}
  const c=document.getElementById("fx");c.hidden=false;const dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const g=c.getContext("2d");g.scale(dpr,dpr);const css=getComputedStyle(document.documentElement);
  const cols=["--w1","--w2","--w3","--w4","--accent"].map(v=>css.getPropertyValue(v).trim()||"#c33");
  const P=[];for(let b=0;b<4;b++){const x=innerWidth*(0.2+0.6*Math.random()),y=innerHeight*(0.2+0.3*Math.random()),col=cols[b%cols.length];
    for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*4.5;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*30,col,d:b*9});}}
  let f=0;(function tick(){g.clearRect(0,0,innerWidth,innerHeight);let alive=0;
    P.forEach(p=>{if(f<p.d){alive++;return;}if(p.l<=0)return;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.07;p.vx*=0.985;p.l--;g.globalAlpha=Math.min(1,p.l/30);g.fillStyle=p.col;g.fillRect(p.x,p.y,3,3);});
    f++;if(alive&&f<160)requestAnimationFrame(tick);else{g.clearRect(0,0,innerWidth,innerHeight);c.hidden=true;}})();
}

  S.sessions.push(ss);S.active=ss.id;Object.keys(draft).forEach(k=>delete draft[k]);save();keepAwake();render();scrollTo(0,0);

function logSet(exId){
  const ss=activeSession(),ex=exById(exId),d=draft[exId];
  const w=Number(d.w),reps=Number(d.reps);
  if(d.w===null||d.w===""||isNaN(w)){toast("Enter a weight first");return;}
  if(!reps||reps<1){toast("Enter your reps");return;}
  if(d.rir==null){toast("Tap your RIR");return;}
  const tg=target(ex,w,ss.wk);
  const pr=checkPR(ex,w,reps,ss.off);
  const st={id:uid(),ex:exId,part:d.part,w,reps,rir:d.rir,ts:Date.now()};
  st.nudge=nudgeFor(ex,st,ss.wk,tg);
  ss.sets.push(st);d.reps=null;d.rir=null;save();render();
  if(pr)openSheet(prSheet(st.id,pr)),(ui.pendingPR={id:st.id,text:pr.text});
}
function loadSample(){
  const t=today(),start=addDays(t,-20);S.sample={prevStart:S.cycleStart};S.cycleStart=start;
  const base={Press:[55,12],Fly:[30,15],Raise:[20,15],Curl:[30,12],Extension:[30,14],Pressdown:[60,14],Pulldown:[160,10],Row:[120,12],Shrug:[70,15],Pullover:[50,14],Crossover:[40,15],Dips:[0,15],Pullup:[60,10],"Pec Deck":[110,14]};
  const baseFor=n=>{let b=[50,12];Object.keys(base).forEach(k=>{if(n.indexOf(k)>=0)b=base[k];});return b;};
  const capAt=(b,w)=>{if(w===b[0])return b[1];const e1=b[0]*(1+b[1]/30);return Math.max(3,Math.round(30*(e1/w-1)));};
  let day="push",d=0;const skip=[5,12,17];
  while(d<20){ if(skip.includes(d)){d++;continue;} const date=addDays(start,d),wk=weekAt(date).idx,W=S.weeks[wk];
    const ss={id:uid(),date,day,wk,off:false,sets:[],lineup:{},extraParts:[],sample:true};
    DAYPARTS[day].forEach(pk=>{ if(pk==="abs"){for(let i=0;i<5;i++)ss.sets.push({id:uid(),ex:"abs",part:"abs",w:0,reps:1,rir:null,counter:true});return;}
      const pool=S.exercises.filter(e=>e.part===pk&&!e.hidden&&e.kind!=="counter"); const n=Math.min(pool.length,Math.max(1,Math.ceil(S.parts[pk].min/2)));
      const off=(d*3)%pool.length; ss.lineup[pk]=[];
      for(let i=0;i<n;i++){const ex=pool[(off+i)%pool.length];ss.lineup[pk].push(ex.id);const b=baseFor(ex.name);
        for(let k=0;k<2;k++){let w=b[0];if(ex.kind!=="bodyweight"){w=b[0]+((d+k)%3-1)*(ex.kind==="assist"?-10:5);if(wk===3)w=Math.round(b[0]*0.8/5)*5;}
          const cap=ex.kind==="assist"?b[1]+Math.round((w-b[0])/10):capAt(b,w)||b[1]; const rir=wk===3?4:Math.round((W.min+W.max)/2+(k?-1:0)); const reps=Math.max(3,cap-Math.max(0,rir));
          ss.sets.push({id:uid(),ex:ex.id,part:pk,w,reps,rir:Math.max(0,rir),sample:true});}}
    });
    S.sessions.push(ss); day=day==="push"?"pull":"push"; if(d===9){const lg={id:uid(),date,day:"legs",wk,off:false,sets:[],lineup:{legs:[]},extraParts:[],sample:true};
      S.exercises.filter(e=>e.part==="legs").slice(0,3).forEach(ex=>{lg.lineup.legs.push(ex.id);const b=[ex.kind==="bodyweight"?0:90,12];for(let k=0;k<2;k++)lg.sets.push({id:uid(),ex:ex.id,part:"legs",w:b[0],reps:b[1]-1,rir:2});});S.sessions.push(lg);}
    d++; }
  save();render();toast("Example history loaded");
}

    case "stepW":{const d=draft[v],ex=exById(v);let w=d.w==null||d.w===""?(ex.kind==="bodyweight"?0:20):Number(d.w);w=Math.max(0,w+Number(b.dataset.d));d.w=w;document.getElementById("w-"+v).value=w;updTarget(v);break;}

      try{navigator.clipboard.writeText(txt).then(()=>toast("Backup copied"),fallback);}catch(err){fallback();}break;}
    case "showImport":document.getElementById("imp").hidden=false;break;
    case "doImport":{try{const o=JSON.parse(document.getElementById("impText").value);if(!o||!o.exercises||!o.sessions)throw 0;S=o;save();render();toast("Backup restored");}catch(err){toast("That text isn’t a valid backup");}break;}
    case "resetAsk":document.getElementById("resetZone").innerHTML='<p class="small"><b>Erase all data on this phone?</b></p><div class="row"><button class="btn danger" data-act="resetYes">Yes, erase</button><button class="btn" data-act="resetNo">Keep it</button></div>';break;
    case "resetYes":S=freshState();save();render();toast("Erased");break;
    case "resetNo":render();break;
  }
});
document.addEventListener("input",e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  if((f==="w"||f==="reps")&&draft[el.dataset.ex]){const val=el.value.trim();draft[el.dataset.ex][f]=val===""?null:Number(val);if(f==="w")updTarget(el.dataset.ex);}
});
document.addEventListener("change",e=>{
  const el=e.target,f=el.dataset.f;if(!f||f==="w"||f==="reps")return;
  const num=Number(el.value);
  if(f==="note"){exById(el.dataset.ex).note=el.value.trim();}
  else if(f==="name"){const n=el.value.trim();if(n)exById(el.dataset.ex).name=n;}
  else if(f==="formFocus"){exById(el.dataset.ex).formFocus=el.checked;}
  else if(f==="cycleStart"&&el.value){S.cycleStart=el.value;}
  else if(f==="wlabel"){S.weeks[el.dataset.i].label=el.value.trim()||S.weeks[el.dataset.i].label;}
  else if(f==="wmin"&&!isNaN(num)){S.weeks[el.dataset.i].min=num;}
  else if(f==="wmax"&&!isNaN(num)){S.weeks[el.dataset.i].max=num;}
  else if(f==="pmin"&&!isNaN(num)){S.parts[el.dataset.k].min=num;}
  else if(f==="pmax"&&!isNaN(num)){S.parts[el.dataset.k].max=num;}
  else if(f==="legsDays"&&num>0){S.legsDays=num;}
  else if(f==="minPerWeek"&&num>0){S.minPerWeek=num;}
  else return;
  save(); if(f!=="note")render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

load();
if(S.active&&!activeSession())S.active=null;
render();
if(S.active)keepAwake();
})();
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
